[workspace]
resolver = "2"
members = ["crates/gcode", "crates/machine", "crates/blueskyt", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gcode = { path = "crates/gcode", package = "cnc-gcode" }
machine = { path = "crates/machine", package = "cnc-machine" }
blueskyt = { path = "crates/blueskyt", package = "cnc-blueskyt" }
thiserror = "2"
