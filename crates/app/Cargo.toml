[package]
name = "cnc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop CNC controller (Mach3 replacement)"

[[bin]]
name = "cnc-controller"
path = "src/main.rs"

[dependencies]
gcode.workspace = true
machine.workspace = true
blueskyt.workspace = true
# Listening to the cut: the sound card input on every build (it does nothing without a microphone).
listen = { workspace = true, features = ["audio"] }
# The spindle VFD's readings over a USB-RS485 adapter (does nothing without one).
vfd = { workspace = true, features = ["serial"] }
eframe = "0.33"
# Tool photos in the tool change window.
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
wry = "0.57"

[build-dependencies]
# The .exe's icon on Windows.
embed-resource = "3"
