[package]
name = "cnc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop CNC controller (Mach3 replacement)"

[[bin]]
name = "cnc-controller"
path = "src/main.rs"

[dependencies]
gcode.workspace = true
machine.workspace = true
blueskyt.workspace = true
eframe = "0.33"
# Tool photos in the tool change window.
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
wry = "0.57"
